[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ottvid"
version = "0.1.0"
description = "OT-based Temporal Token Merging for Video LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.0",
    "transformers==4.57.3",
    "safetensors>=0.4",
    "decord==0.6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "Pillow>=10.0"]

[tool.setuptools.packages.find]
include = ["ottvid*"]

